[global]
  server role = standalone server
  server min protocol = SMB2_10
  map to guest = never
  disable netbios = yes
  smb ports = 445
  load printers = no
  log level = 1

[test]
  path = /share
  read only = no
  valid users = shuttle
  force user = shuttle
  # Symlinks on the server stay inside the share, and show up as such.
  wide links = no
