name: Bug report
description: Something does not work the way it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security vulnerabilities do not go here — see
        [SECURITY.md](../blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, and what it did instead of what you expected.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the shuttle's mode (push/pull/sync), its profile settings, and the share type (SMB/NFS).
      placeholder: |
        1.
        2.
        3.
      render: shell
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `shuttle version`, or the commit SHA.
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: Fedora 44, GNOME 50, x86_64; NAS model / Samba version
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "`journalctl --user -u shuttle` output. Redact share hostnames, usernames and paths you do not want public."
      render: shell
