name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # By hand, on main or a branch: to check again without a commit to push,
  # as after Actions was paused.
  workflow_dispatch:

# Cancel superseded runs on the same ref. Never cancel on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

# Every setup-go below uses check-latest: the runner's cached Go can lag a patch
# release behind, and a stale patch both fails govulncheck and ships fixed
# stdlib bugs in release binaries.

jobs:
  # What the pull request changes, so the jobs it cannot affect skip: see
  # .github/actions/changes. Anything but a pull request runs everything.
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.areas.outputs.go }}
      extension: ${{ steps.areas.outputs.extension }}
      packaging: ${{ steps.areas.outputs.packaging }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # both ends of the pull request, for the diff
      - id: areas
        uses: ./.github/actions/changes

  lint:
    name: lint
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.packaging == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          check-latest: true
          cache: true
      - name: gofmt
        run: make fmt-check
      - name: desktop-file-validate
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends desktop-file-utils
      - name: systemd unit and desktop file
        run: make unit-check
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0   # keep in step with GOLANGCI_LINT in the Makefile

  test:
    name: test (go ${{ matrix.go }})
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every entry is a support commitment; dropping one is a breaking change.
        go:
          - '1.26'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
          cache: true
      - run: go test -race -coverprofile=coverage.out -covermode=atomic ./...
      - name: coverage summary
        run: go tool cover -func=coverage.out | tail -1 >> "$GITHUB_STEP_SUMMARY"

  build:
    name: build
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          check-latest: true
          cache: true
      - run: make build
      # Releases ship arm64 too; catch anything that only builds on amd64.
      - name: cross-compile linux/arm64
        run: GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build ./...
      # The Android app will reuse the core: catch a Linux-desktop-only call the
      # day it lands. vet as well, so the tests are compiled for it too.
      # android/amd64 cannot link without cgo and the NDK.
      - name: cross-compile android/arm64
        env:
          GOOS: android
          GOARCH: arm64
          CGO_ENABLED: '0'
        run: |
          go build ./...
          go vet ./...

  integration:
    name: integration
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          check-latest: true
          cache: true
      - name: install a Secret Service
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gnome-keyring dbus libsecret-tools
      - name: start the test Samba server
        run: make samba-up CONTAINER=docker
      # Every test runs, against Samba and a throwaway keyring; none of them
      # should skip here.
      - run: make test-integration
      - name: samba log
        if: failure()
        run: docker logs shuttle-samba

  nfs:
    name: nfs
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          check-latest: true
          cache: true
      # The engine suite against the in-process NFSv3 server.
      - run: make test-nfs

  # The GNOME extension: eslint, and its unit tests in plain gjs. Its run in
  # a headless GNOME Shell needs Shell 50, which the runner does not have:
  # that is `make test-extension`, before a PR.
  extension:
    name: extension
    needs: changes
    if: needs.changes.outputs.extension == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: make lint-extension
      - name: install gjs
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gjs gir1.2-glib-2.0
      - run: gjs -m extension/test/run.js

  # Phase 5's exit condition, against the Linux kernel server: shuttle's own
  # NFSv3 client straight to it, then, with NFSv3 turned off, the engine
  # suite through an NFSv4 mount (a share of type "path").
  nfs-kernel:
    name: nfs (kernel server)
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          check-latest: true
          cache: true
      - name: start the kernel NFS server
        run: test/nfs/kernel-server.sh v3
      # No port: the client asks the server's portmapper, as it does a NAS's.
      - name: NFSv3, directly
        env:
          SHUTTLE_TEST_NFS: 127.0.0.1
          SHUTTLE_TEST_NFS_EXPORT: /srv/nfs/v3
          SHUTTLE_TEST_NFS_DIR: /srv/nfs/v3
        run: |
          go test -race -count=1 -run NFS ./internal/fsys/
          go test -count=1 -run TestRemoteSide -v ./internal/engine/
          go test -race -count=1 ./internal/engine/
      - name: turn NFSv3 off, and mount the server over NFSv4
        run: test/nfs/kernel-server.sh v4-only
      # After the mount: the server is up, so a refusal is the server's.
      - name: NFSv4, through the mount
        env:
          SHUTTLE_TEST_MOUNT_DIR: /mnt/nfs4
          SHUTTLE_TEST_NFS4_ONLY: 127.0.0.1
        run: |
          go test -count=1 -run TestNFSv4OnlyServer -v ./internal/nfs3/
          go test -count=1 -run TestRemoteSide -v ./internal/engine/
          go test -race -count=1 ./internal/engine/
      - name: server log
        if: failure()
        run: sudo journalctl -u nfs-server -u nfs-mountd -u rpcbind --no-pager | tail -100

  systemd:
    name: systemd
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.packaging == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          check-latest: true
          cache: true
      # Rootless podman cannot run a systemd container on the runner (no
      # cgroup delegation for its user), so this one uses sudo.
      - run: make test-systemd PODMAN="sudo podman"

  tui:
    name: tui
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          check-latest: true
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tmux dbus
      - run: make test-tui

  vuln:
    name: govulncheck
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          check-latest: true
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  # The one check branch protection requires of CI: every job passed, or was
  # skipped as nothing it tests changed. A job added above goes in needs.
  ci:
    name: ci
    if: always()
    needs: [changes, lint, test, build, integration, nfs, extension, nfs-kernel, systemd, tui, vuln]
    runs-on: ubuntu-latest
    steps:
      - name: every job passed or was not needed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          ! jq -e 'any(.[]; .result == "failure" or .result == "cancelled")' <<<"$NEEDS" >/dev/null
