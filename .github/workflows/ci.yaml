name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref. Never cancel on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

# Every setup-go below uses check-latest: the runner's cached Go can lag a patch
# release behind, and a stale patch both fails govulncheck and ships fixed
# stdlib bugs in release binaries.

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          check-latest: true
          cache: true
      - name: gofmt
        run: make fmt-check
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0   # keep in step with GOLANGCI_LINT in the Makefile

  test:
    name: test (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every entry is a support commitment; dropping one is a breaking change.
        go:
          - '1.26'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
          cache: true
      - run: go test -race -coverprofile=coverage.out -covermode=atomic ./...
      - name: coverage summary
        run: go tool cover -func=coverage.out | tail -1 >> "$GITHUB_STEP_SUMMARY"

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          check-latest: true
          cache: true
      - run: make build
      # Releases ship arm64 too; catch anything that only builds on amd64.
      - name: cross-compile linux/arm64
        run: GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build ./...

  smb:
    name: smb integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          check-latest: true
          cache: true
      - name: start the test Samba server
        run: make samba-up CONTAINER=docker
      # Every test runs, the SMB ones included; they skip only when no server
      # is configured, which here is a failure of this job's setup.
      - run: make test-smb
      - name: samba log
        if: failure()
        run: docker logs shuttle-samba

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          check-latest: true
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
