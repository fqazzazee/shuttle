name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, off-hours. Catches newly published queries against unchanged code.
    - cron: '27 4 * * 1'

permissions:
  contents: read

jobs:
  # What the pull request changes: see .github/actions/changes. Go code is
  # analysed when it changes, the extension's JavaScript when it does;
  # pushes and the weekly run analyse both.
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.areas.outputs.go }}
      extension: ${{ steps.areas.outputs.extension }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # both ends of the pull request, for the diff
      - id: areas
        uses: ./.github/actions/changes

  # Two jobs, not a matrix: a job's condition cannot read its matrix. The
  # category keeps each language's results where they always were.
  analyze-go:
    name: analyze (go)
    needs: changes
    # Code scanning needs a public repo on the free plan.
    if: ${{ !github.event.repository.private && needs.changes.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: go
          build-mode: autobuild
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:go

  analyze-javascript:
    name: analyze (javascript-typescript)
    needs: changes
    if: ${{ !github.event.repository.private && needs.changes.outputs.extension == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
      # The GNOME extension; nothing to build.
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript

  # The one check branch protection requires of CodeQL, as `ci` is of CI.
  # Not "codeql": code scanning posts a check of its own named CodeQL.
  analyze:
    name: analyze
    if: always()
    needs: [changes, analyze-go, analyze-javascript]
    runs-on: ubuntu-latest
    steps:
      - name: every analysis passed or was not needed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          ! jq -e 'any(.[]; .result == "failure" or .result == "cancelled")' <<<"$NEEDS" >/dev/null
