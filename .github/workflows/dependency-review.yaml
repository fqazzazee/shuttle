name: Dependency review

# Blocks PRs that add dependencies with known vulnerabilities or licenses that
# cannot ship inside shuttle's binary, which is under the PolyForm licenses: the
# GPL and its kind would make all of it GPL. The LGPL can, with the relinking
# the LICENSE allows. The extension's npm tooling is never shipped.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  review:
    name: review
    # Needs the dependency graph, which is public-repo-only on the free plan.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5.0.0   # no floating v5 tag exists
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
          deny-licenses: GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later, SSPL-1.0, BUSL-1.1
