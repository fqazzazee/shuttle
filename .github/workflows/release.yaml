name: Release

on:
  push:
    tags: ['v*']
  # A dry run of the APK: built, signed and checked against the pinned
  # certificate as a release's would be, kept as this run's artifact. Nothing
  # is released: the release job runs for a tag only.
  workflow_dispatch:
    inputs:
      version:
        description: The X.Y.Z to build the APK as (0.0.0 is no version code)
        default: '0.0.1'

permissions:
  contents: read

jobs:
  # The Android app, signed with the release key (DECISIONS 2026-10-14). The key
  # is in the secrets only: ANDROID_SIGNING_KEY (the PKCS12 file, base64),
  # ANDROID_SIGNING_PASSWORD and ANDROID_SIGNING_ALIAS. Without them, there is
  # no release.
  apk:
    name: apk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          check-latest: true
      - name: use Java 21
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
      - name: install the NDK
        run: |
          ndk=$(sed -n 's/^NDK_VERSION *?= *//p' Makefile)
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" >/dev/null
      - name: the release key, from the secrets
        env:
          SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
        run: |
          test -n "$SIGNING_KEY" || { echo "::error::no ANDROID_SIGNING_KEY secret: the release key is not set up"; exit 1; }
          umask 077
          echo "$SIGNING_KEY" | base64 -d > "$RUNNER_TEMP/release.p12"
      - name: build and sign
        run: make apk ANDROID_HOME="$ANDROID_HOME" APK_VERSION="${VERSION#v}"
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
          SHUTTLE_SIGNING_KEYSTORE: ${{ runner.temp }}/release.p12
          SHUTTLE_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
          SHUTTLE_SIGNING_ALIAS: ${{ secrets.ANDROID_SIGNING_ALIAS }}
      - name: forget the key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"
      # A release signed with any other key would not install over the last
      # one: every user would have to uninstall, losing the app's settings.
      - name: signed with the release key
        run: |
          want=$(tr -d ' \n' < android/release-cert.sha256)
          got=$(make -s apk-cert APK_VERSION="${VERSION#v}" ANDROID_HOME="$ANDROID_HOME")
          echo "certificate SHA-256: $got"
          test -n "$want" && test "$got" = "$want"
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
      - uses: actions/upload-artifact@v7
        with:
          name: apk
          path: build/apk/*.apk
          if-no-files-found: error
          # A dry run's is for a look, not to keep: it is signed with the release key.
          retention-days: ${{ github.event_name == 'push' && 7 || 1 }}

  release:
    name: release
    needs: apk
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the release and upload assets
      id-token: write      # the attestations' signing identity
      attestations: write  # store them with the repository
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # goreleaser builds the changelog from history
      # goreleaser adds it to the release and to checksums.txt.
      - uses: actions/download-artifact@v7
        with:
          name: apk
          path: build/apk
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          check-latest: true
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: 'v2.17.1'   # keep in step with GORELEASER in the Makefile
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # That each file was built here, by this workflow, from the tagged commit:
      # the Windows programs are not signed, so this is what vouches for them
      # (DECISIONS 2026-10-16). `gh attestation verify` checks it.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.rpm
            dist/*.deb
            build/apk/*.apk

# Tag only after CI is green on the commit being tagged:
#   git tag -s vX.Y.Z && git push origin vX.Y.Z
