name: Release

on:
  push:
    tags: ['v*']
  # A dry run of the APK: built, signed and checked against the pinned
  # certificate as a release's would be, kept as this run's artifact. Nothing
  # is released: the release job runs for a tag only.
  workflow_dispatch:
    inputs:
      version:
        description: The X.Y.Z to build the APK as (0.0.0 is no version code)
        default: '0.0.1'

permissions:
  contents: read

jobs:
  # A release comes only from a commit on main whose CI passed (DECISIONS
  # 2026-11-22), checked before the signing key is touched. Only the run for
  # the push to main counts: a pull request's skips the jobs its changes cannot
  # affect. The APK's dry run releases nothing, so it has nothing to check.
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read   # the CI run of the tagged commit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name != 'workflow_dispatch'
        with:
          fetch-depth: 0   # main's history, to find the commit in it
      - name: the tag is on main and its commit passed CI
        if: github.event_name != 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse --verify "$GITHUB_SHA^{commit}")
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$sha" refs/remotes/origin/main; then
            echo "::error::$GITHUB_REF_NAME ($sha) is not on main: no release"
            exit 1
          fi
          passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yaml/runs?head_sha=$sha&event=push&branch=main&status=success" |
            jq --arg sha "$sha" '[.workflow_runs[] | select(.head_sha == $sha and .path == ".github/workflows/ci.yaml" and .event == "push" and .head_branch == "main" and .conclusion == "success")] | length')
          # Anything but a count of at least one, an empty answer included, stops here.
          [ "$passed" -ge 1 ] || {
            echo "::error::no passed CI run for the push of $sha to main: wait for CI, then re-run this workflow"
            exit 1
          }

  # The Android app, signed with the release key (DECISIONS 2026-10-14). The key
  # is in the secrets only: ANDROID_SIGNING_KEY (the PKCS12 file, base64),
  # ANDROID_SIGNING_PASSWORD and ANDROID_SIGNING_ALIAS. Without them, there is
  # no release.
  apk:
    name: apk
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.26'
          check-latest: true
      - name: use Java 21
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
      - name: install the NDK
        run: |
          ndk=$(sed -n 's/^NDK_VERSION *?= *//p' Makefile)
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" >/dev/null
      - name: the release key, from the secrets
        env:
          SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
        run: |
          test -n "$SIGNING_KEY" || { echo "::error::no ANDROID_SIGNING_KEY secret: the release key is not set up"; exit 1; }
          umask 077
          echo "$SIGNING_KEY" | base64 -d > "$RUNNER_TEMP/release.p12"
      - name: build and sign
        run: make apk ANDROID_HOME="$ANDROID_HOME" APK_VERSION="${VERSION#v}"
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
          SHUTTLE_SIGNING_KEYSTORE: ${{ runner.temp }}/release.p12
          SHUTTLE_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
          SHUTTLE_SIGNING_ALIAS: ${{ secrets.ANDROID_SIGNING_ALIAS }}
      - name: forget the key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"
      # A release signed with any other key would not install over the last
      # one: every user would have to uninstall, losing the app's settings.
      - name: signed with the release key
        run: |
          want=$(tr -d ' \n' < android/release-cert.sha256)
          got=$(make -s apk-cert APK_VERSION="${VERSION#v}" ANDROID_HOME="$ANDROID_HOME")
          echo "certificate SHA-256: $got"
          test -n "$want" && test "$got" = "$want"
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apk
          path: build/apk/*.apk
          if-no-files-found: error
          # A dry run's is for a look, not to keep: it is signed with the release key.
          retention-days: ${{ github.event_name == 'push' && 7 || 1 }}

  release:
    name: release
    needs: [gate, apk]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the release and upload assets
      id-token: write      # the attestations' signing identity
      attestations: write  # store them with the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # goreleaser builds the changelog from history
      # goreleaser adds it to the release and to checksums.txt.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apk
          path: build/apk
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.26'
          check-latest: true
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: 'v2.17.1'   # keep in step with GORELEASER in the Makefile
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # That each file was built here, by this workflow, from the tagged commit:
      # the Windows programs are not signed, so this is what vouches for them
      # (DECISIONS 2026-10-16). `gh attestation verify` checks it.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.rpm
            dist/*.deb
            dist/checksums.txt
            build/apk/*.apk
      # The globs above would miss a new kind of file: ask of what the draft
      # actually holds, so that nothing unattested goes public.
      - name: every file of the release is attested
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          names=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          test -n "$names" || { echo "::error::the draft of $GITHUB_REF_NAME has no files"; exit 1; }
          while IFS= read -r name; do
            file=dist/$name
            [ -f "$file" ] || file=build/apk/$name
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY" >/dev/null ||
              { echo "::error::$name is not attested: the release stays a draft"; exit 1; }
          done <<<"$names"
      - name: publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false

# Tag a commit on main once CI is green on it; the gate job refuses any other:
#   git tag -s vX.Y.Z && git push origin vX.Y.Z
