# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: shuttle

# The files `make install` fills in, filled in for /usr: see `make package-files`.
before:
  hooks:
    - make package-files

builds:
  - id: shuttle
    main: ./cmd/shuttle
    binary: shuttle
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{ .Version }}"]

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, README.md]

checksum:
  name_template: checksums.txt

nfpms:
  - package_name: shuttle
    homepage: https://github.com/fqazzazee/shuttle
    maintainer: Fadi Q <fadi.qazzazee@gmail.com>
    description: Push, pull and sync folders between SMB/NFS shares and local storage.
    # The program under the PolyForm licenses; the extension it installs under
    # the GPL (LICENSE says which is which).
    license: (PolyForm-Noncommercial-1.0.0 OR LicenseRef-PolyForm-Internal-Use-1.0.0) AND GPL-2.0-or-later
    formats: [rpm, deb]
    bindir: /usr/bin
    # What `make install` and `make install-extension` put in place. The service
    # is a user unit, enabled by each user (the README says how); the extension
    # is there for each user to enable.
    contents:
      - src: build/package/shuttle.service
        dst: /usr/lib/systemd/user/shuttle.service
      - src: build/package/io.github.fqazzazee.Shuttle.desktop
        dst: /usr/share/applications/io.github.fqazzazee.Shuttle.desktop
      - src: packaging/icons/io.github.fqazzazee.Shuttle.svg
        dst: /usr/share/icons/hicolor/scalable/apps/io.github.fqazzazee.Shuttle.svg
      - src: extension/icons/shuttle-symbolic.svg
        dst: /usr/share/icons/hicolor/symbolic/apps/io.github.fqazzazee.Shuttle-symbolic.svg
      # tree: the folders inside it (lib/, icons/) stay folders.
      - src: build/package/extension
        dst: /usr/share/gnome-shell/extensions/shuttle@fqazzazee.github.io
        type: tree
      - src: LICENSE
        dst: /usr/share/licenses/shuttle/LICENSE
        packager: rpm
      - src: extension/LICENSE
        dst: /usr/share/licenses/shuttle/LICENSE.extension
        packager: rpm
      - src: LICENSE
        dst: /usr/share/doc/shuttle/copyright
        packager: deb
      - src: extension/LICENSE
        dst: /usr/share/doc/shuttle/LICENSE.extension
        packager: deb

# Release notes come from conventional commit subjects (squash merges keep them
# one per PR).
changelog:
  use: git
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Other changes
      order: 999
  filters:
    exclude: ['^docs', '^test', '^ci', '^chore']
