# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: shuttle

# The files `make install` fills in, filled in for /usr: see `make package-files`.
before:
  hooks:
    - make package-files

builds:
  - id: shuttle
    main: ./cmd/shuttle
    binary: shuttle
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{ .Version }}"]

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - src: build/package/THIRD_PARTY_NOTICES
        strip_parent: true

checksum:
  name_template: checksums.txt

nfpms:
  - package_name: shuttle
    homepage: https://github.com/fqazzazee/shuttle
    maintainer: Fadi Q <fadi.qazzazee@gmail.com>
    description: Push, pull and sync folders between SMB/NFS shares and local storage.
    # The program under the PolyForm licenses; the extension it installs under
    # the GPL (LICENSE says which is which).
    license: (PolyForm-Noncommercial-1.0.0 OR LicenseRef-PolyForm-Internal-Use-1.0.0) AND GPL-2.0-or-later
    formats: [rpm, deb]
    bindir: /usr/bin
    # What `make install` and `make install-extension` put in place. The service
    # is a user unit, enabled by each user (the README says how); the extension
    # is there for each user to enable.
    contents:
      - src: build/package/shuttle.service
        dst: /usr/lib/systemd/user/shuttle.service
      - src: build/package/io.github.fqazzazee.Shuttle.desktop
        dst: /usr/share/applications/io.github.fqazzazee.Shuttle.desktop
      - src: packaging/icons/io.github.fqazzazee.Shuttle.svg
        dst: /usr/share/icons/hicolor/scalable/apps/io.github.fqazzazee.Shuttle.svg
      - src: extension/icons/shuttle-symbolic.svg
        dst: /usr/share/icons/hicolor/symbolic/apps/io.github.fqazzazee.Shuttle-symbolic.svg
      # tree: the folders inside it (lib/, icons/) stay folders.
      - src: build/package/extension
        dst: /usr/share/gnome-shell/extensions/shuttle@fqazzazee.github.io
        type: tree
      - src: LICENSE
        dst: /usr/share/licenses/shuttle/LICENSE
        packager: rpm
      - src: extension/LICENSE
        dst: /usr/share/licenses/shuttle/LICENSE.extension
        packager: rpm
      - src: build/package/THIRD_PARTY_NOTICES
        dst: /usr/share/licenses/shuttle/THIRD_PARTY_NOTICES
        packager: rpm
      # Debian's one copyright file: LICENSE, the extension's, the notices.
      - src: build/package/copyright
        dst: /usr/share/doc/shuttle/copyright
        packager: deb

# What each release's page says above its changelog.
release:
  header: |
    Install as a package, for amd64 (tested on Fedora 44 and Debian stable) or arm64
    (built, not yet tested):

    ```bash
    # Fedora
    sudo dnf install https://github.com/fqazzazee/shuttle/releases/download/{{ .Tag }}/shuttle_{{ .Version }}_linux_amd64.rpm
    # Debian, Ubuntu
    curl -LO https://github.com/fqazzazee/shuttle/releases/download/{{ .Tag }}/shuttle_{{ .Version }}_linux_amd64.deb
    sudo apt install ./shuttle_{{ .Version }}_linux_amd64.deb
    ```

    Then enable the service and, on GNOME 50, the extension: see the
    [README](https://github.com/fqazzazee/shuttle#install).

    On Android 11 or later (arm64): download `shuttle_{{ .Version }}_android_arm64.apk` on the
    phone and open it. It installs over an earlier release, keeping its setup; see the
    [README](https://github.com/fqazzazee/shuttle#android).

    `checksums.txt` has every file's SHA-256.

    shuttle is source-available under PolyForm Noncommercial 1.0.0 or PolyForm Internal Use
    1.0.0; its GNOME extension is GPL-2.0-or-later. See
    [LICENSE](https://github.com/fqazzazee/shuttle/blob/{{ .Tag }}/LICENSE).

# Release notes come from conventional commit subjects (squash merges keep them
# one per PR).
changelog:
  use: git
  sort: asc
  abbrev: -1   # no hashes: each line names its PR
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Other changes
      order: 999
  filters:
    exclude: ['^docs', '^test', '^ci', '^chore']
